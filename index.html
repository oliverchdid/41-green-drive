.donut{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center}

<script>
(() => {
"use strict";
const SHARED = ["Oil","Electricity","Internet","Water","Other Shared"];
const PERSONAL_DEFAULT = ["Oil","Electricity","Internet","Water","Repairs & Maintenance","Appliances & Furniture","Improvements","Supplies","Other"];
const SPLIT_BY_LINES = "Split by lines";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOT = {"Mortgage":"var(--c-mort)","Car insurance":"var(--c-car)","Oil":"var(--c-oil)","Electricity":"var(--c-elec)","Internet":"var(--c-net)","Water":"var(--c-water)","Other Shared":"var(--c-other)","Phone":"var(--c-phone)","Not split":"var(--c-personal)","Payment":"var(--owed)"};
const PRIVATE = "private/owner/personal";

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const moneyShort = n => (n < 0 ? "-" : "") + "$" + Math.round(Math.abs(+n||0)).toLocaleString("en-US");
const money = n => (n < 0 ? "-" : "") + "$" + Math.abs(+n || 0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const r2 = n => Math.round((+n || 0) * 100) / 100;
const today = new Date();
const pad = n => String(n).padStart(2,"0");
const isoToday = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
const signed = {};
const blobUrl = id => signed[id] || "";
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

const state = {

// ---------- math ----------
function lineCounts(){
  const counts = {}; S().people.forEach(p => counts[p]=0);
  (S().lines||[]).forEach(l => { if (l.type==="Phone" && counts[l.assignedTo] !== undefined) counts[l.assignedTo]++; });
  return counts;
}
function sharesOf(e){
  const out = {}; const s = S();
  const add = (p,v) => { out[p] = (out[p]||0) + v; };
  if (e.fixedShares && e.kind === "shared"){ s.people.forEach(p => add(p, +e.fixedShares[p]||0)); return out; }
  if (e.kind === "shared"){
    const sp = (s.splits||{})[e.category] || {};
    s.people.forEach(p => add(p, (+e.amount||0) * ((+sp[p]||0)/100)));
  } else if (e.kind === "personal"){
    add(e.paidBy || s.me, +e.amount||0);
  } else if (e.kind === "phone"){
    const counts = lineCounts(); const tot = Object.values(counts).reduce((a,b)=>a+b,0);
    (e.lines||[]).forEach(l => {
      const amt = +l.amount||0;
      if (l.assignedTo === SPLIT_BY_LINES){
        if (tot > 0) Object.entries(counts).forEach(([p,c]) => c && add(p, amt*c/tot));
        else { const owners=[...new Set((e.lines||[]).map(x=>x.assignedTo).filter(x=>s.people.includes(x)))]; owners.forEach(p=>add(p, amt/owners.length)); if(!owners.length) add("Unassigned", amt); }
      } else if (s.people.includes(l.assignedTo)) add(l.assignedTo, amt);
      else add("Unassigned", amt);
    });
  }
  return out;
}
const EXTRA_COLORS = ["#E86A92","#14B8A6","#C084FC","#84CC16","#F97316"];
function catList(list){
  const extra = [...new Set(list.filter(e=>e.kind==="shared" && !SHARED.includes(e.category)).map(e=>e.category))].sort();
  extra.forEach((c,i) => { if (!DOT[c]) DOT[c] = EXTRA_COLORS[Object.keys(DOT).length % EXTRA_COLORS.length]; });
  return [...SHARED, ...extra, "Phone"];
}
const shortDate = iso => { if (!/^\d{4}-\d{2}-\d{2}$/.test(iso||"")) return ""; const [y,m,d] = iso.split("-").map(Number); return `${MONTHS[m-1].slice(0,3)} ${d}`; };
const serviceText = e => (e.serviceFrom && e.serviceTo) ? `${shortDate(e.serviceFrom)} - ${shortDate(e.serviceTo)}${e.serviceTo.slice(0,4)!==e.serviceFrom.slice(0,4)?", "+e.serviceTo.slice(0,4):""}` : "";
const periodOf = e => (e.period && /^\d{4}-\d{2}$/.test(e.period)) ? e.period : (e.date ? e.date.slice(0,7) : "");
const inMonth = (e,y,m) => periodOf(e) === `${y}-${pad(m)}`;
const inYear = (e,y) => periodOf(e).slice(0,4) === String(y);

function summarize(list){
  const s = S(); const people = s.people;
  const blank = () => Object.fromEntries(people.map(p=>[p,0]));
  const res = { house:blank(), phone:blank(), paid:blank(), settled:blank(), marked:blank(), own:blank(), cat:{}, personal:0, personalByCat:{}, unassigned:0, payments:[],
                byPersonCat:Object.fromEntries(people.map(p=>[p,{}])), totals:{shared:0,phone:0,personal:0} };
  list.forEach(e => {
    const amt = +e.amount || 0;
    if (e.kind === "payment"){
      res.payments.push(e);
      if (e.from === S().me){
        if (res.settled[e.from] !== undefined) res.settled[e.from] += amt;
        if (res.settled[e.to] !== undefined) res.settled[e.to] -= amt;
      }
      return;
    }
    if (e.kind === "personal"){
      res.personal += amt; res.totals.personal += amt;
      res.personalByCat[e.category||"Other"] = (res.personalByCat[e.category||"Other"]||0) + amt;
      return;
    }
    const sh = sharesOf(e);
    const bucket = e.kind === "phone" ? res.phone : res.house;
    const catKey = e.kind === "phone" ? "Phone" : e.category;
    res.cat[catKey] = (res.cat[catKey]||0) + amt;
    if (e.kind === "phone") res.totals.phone += amt; else res.totals.shared += amt;
    Object.entries(sh).forEach(([p,v]) => {
      if (p === "Unassigned") { res.unassigned += v; return; }
      if (bucket[p] === undefined) return;
      bucket[p] += v; res.byPersonCat[p][catKey] = (res.byPersonCat[p][catKey]||0) + v;
    });
    if (res.paid[e.paidBy] !== undefined) res.paid[e.paidBy] += amt;
    if (res.own[e.paidBy] !== undefined) res.own[e.paidBy] += sh[e.paidBy]||0;   // their own part of a bill they paid is already covered
    Object.keys(e.paidOff||{}).forEach(p => { const v = sh[p]||0; if (p===e.paidBy || v<=0.004 || res.settled[p]===undefined) return; res.settled[p] += v; res.marked[p] += v; if (res.settled[e.paidBy]!==undefined) res.settled[e.paidBy] -= v; });
  });
  res.owes = Object.fromEntries(people.map(p=>[p, res.house[p]+res.phone[p]]));
  // for everyone but you: what's still owed on their bills (money they paid in, or bills they covered, sits in their account)
  const me = S().me;
  res.balance = Object.fromEntries(people.map(p=>[p, p===me ? res.paid[p]+res.settled[p]-res.owes[p] : res.marked[p]+res.own[p]-res.owes[p]]));
  res.base = Object.fromEntries(people.map(p=>[p, p===me ? res.paid[p]-res.owes[p] : res.own[p]-res.owes[p]]));
  return res;
}
function settleUp(balance){
  // everything goes through you: each person either owes you, or you owe them
  const me = S().me; const out = [];
  Object.entries(balance).forEach(([p, v]) => {
    if (p === me) return;
    if (v < -0.005) out.push({from:p, to:me, amt:r2(-v)});
    else if (v > 0.005) out.push({from:me, to:p, amt:r2(v)});
  });
  // people who owe you first (in the list order), anything you owe at the end
  const order = S().people;
  const who = m => m.from === me ? m.to : m.from;
  return out.sort((x,y) => ((x.from===me) - (y.from===me)) || (order.indexOf(who(x)) - order.indexOf(who(y))));
}

// ---------- Month ----------
function monthPayDate(){ const last = new Date(state.year, state.month, 0).getDate(); const d = (today.getFullYear()===state.year && today.getMonth()+1===state.month) ? today.getDate() : last; return `${state.year}-${pad(state.month)}-${pad(d)}`; }

function collection(sum, me){
  const exp = {}, left = {};
  settleUp(sum.base).filter(m=>m.to===me).forEach(m => exp[m.from] = (exp[m.from]||0) + m.amt);
  settleUp(sum.balance).filter(m=>m.to===me).forEach(m => left[m.from] = (left[m.from]||0) + m.amt);
  const people = [...new Set([...Object.keys(exp), ...Object.keys(left)])];
  const rows = people.map(p => ({p, expected:r2(exp[p]||0), left:r2(left[p]||0), got:r2(Math.max(0,(exp[p]||0)-(left[p]||0)))}));
  const t = k => r2(rows.reduce((a,r)=>a+r[k],0));
  return {rows, expected:t("expected"), got:t("got"), left:t("left")};
}
// round chart with each category's share of the month
function donutHtml(pairs){
  const items = pairs.filter(([,v]) => v > 0.004); const total = items.reduce((a,[,v]) => a+v, 0);
  if (!total) return `<p class="muted" style="margin:0">No bills yet for this month.</p>`;
  const R = 70, C = 2*Math.PI*R; let off = 0;
  const gap = items.length > 1 ? 2 : 0;
  const arcs = `<circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--sunk)" stroke-width="28"/>` + items.map(([c,v]) => { const len = v/total*C; const vis = Math.max(0.5, len - gap); const seg = `<circle r="${R}" cx="90" cy="90" fill="none" stroke="${DOT[c]||"var(--c-other)"}" stroke-width="28" stroke-dasharray="${vis.toFixed(2)} ${(C-vis).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"><title>${esc(c==="Other Shared"?"Other":c)}: ${money(v)}</title></circle>`; off += len; return seg; }).join("");
  const legend = items.sort((x,y) => y[1]-x[1]).map(([c,v]) => `<div class="lg"><span class="chip" style="--dot:${DOT[c]||"var(--c-other)"}">${esc(c==="Other Shared"?"Other":c)}</span><span class="pct">${Math.round(v/total*100)}%</span><span class="amtl">${money(v)}</span></div>`).join("");
  return `<div class="donut"><svg viewBox="0 0 180 180" role="img" aria-label="Share of this month's house costs by category">${arcs}<text x="90" y="86" text-anchor="middle" class="dt1">${money(total)}</text><text x="90" y="106" text-anchor="middle" class="dt2">this month</text></svg><div class="legend2">${legend}</div></div>`;
}
function renderMonth(banner){
  const list = allVisible().filter(e=>inMonth(e,state.year,state.month));
  const sum = summarize(list); const s = S(); const me = ME();
  const bills = list.filter(e=>e.kind!=="payment");
  const moves = settleUp(sum.balance);
  let hero;
  if (state.isOwner){
    const lines = moves.map((m,i)=>{
      const who = m.to===me ? `${esc(m.from)} owes you <span class="amt">${money(m.amt)}</span>` : `${esc(m.from===me?"You":m.from)} ${m.from===me?"owe":"owes"} ${esc(m.to)} <span class="amt">${money(m.amt)}</span>`;
      const acct = m.to===me ? accountOf(m.from, `${state.year}-${pad(state.month)}`).account : 0;
      return `<div class="ln"><span class="statement" style="margin:0">${who}</span>${state.db?`<button class="btn" data-pay="${i}">Mark paid</button>`:""}${m.to===me ? `<span class="muted" style="font-size:14px">${acct>0.005 ? `${money(acct)} in account` : "Nothing in account"}</span>` : ""}</div>`;
    });
    const inMoves = new Set(moves.map(m => m.from===me ? m.to : m.from));
    const extra = S().people.filter(p => p!==me && !inMoves.has(p)).map(p => ({p, a:accountOf(p, `${state.year}-${pad(state.month)}`)})).filter(x => x.a.account > 0.005);
    extra.forEach(x => lines.push(`<div class="ln"><span class="statement" style="margin:0;color:var(--ink)">${esc(x.p)} is paid up for ${MONTHS[state.month-1]}</span>${x.a.unpaid > 0.005 ? `<button class="btn" data-acct="${esc(x.p)}">Pay older bills</button>` : ""}<span class="muted" style="font-size:14px">${money(x.a.account)} in account</span></div>`));
    hero = lines.length ? `<div class="settle">${lines.join("")}</div>` : `<p class="statement settled">${bills.length?"Everyone is square for this month.":"Nothing owed yet."}</p>`;
  } else if (me){
    const mine = moves.filter(m=>m.from===me), owed = moves.filter(m=>m.to===me);
    hero = mine.length ? `<p class="statement">${mine.map(m=>`You owe ${esc(m.to)} <span class="amt">${money(m.amt)}</span>`).join("<br>")}</p>`
         : owed.length ? `<p class="statement" style="color:var(--owed)">${owed.map(m=>`${esc(m.from)} owes you ${money(m.amt)}`).join("<br>")}</p>`
         : `<p class="statement settled">You're all paid up for this month.</p>`;
  } else hero = `<p class="statement settled">Pick your name above.</p>`;
  const total = sum.totals.shared + sum.totals.phone + sum.totals.personal;
  const paidNotes = sum.payments.filter(p => state.isOwner || p.from===me || p.to===me).map(p=>`<div class="paidnote">${esc(p.from)} paid ${esc(p.to)} ${money(p.amount)} on ${MONTHS[+p.date.slice(5,7)-1].slice(0,3)} ${+p.date.slice(8,10)}${state.isOwner?` <button class="linkbtn danger" data-unpay="${esc(p.id)}">Undo</button>`:""}</div>`).join("");
  let html = banner + `<section class="hero"><div class="when">${MONTHS[state.month-1]} ${state.year}</div>${hero}${paidNotes?`<details class="paylog"${state.payOpen?" open":""}><summary><span class="arr">▸</span> Payments this month <span class="cnt">${sum.payments.filter(p => state.isOwner || p.from===me || p.to===me).length}</span></summary><div class="paylist">${paidNotes}</div></details>`:""}
    <p class="sub">${bills.length ? `${money(total)} in house costs this month across ${bills.length} ${bills.length===1?"bill":"bills"}.` : "No bills yet for this month."}
    ${sum.unassigned && state.isOwner ? `<br><strong>${money(sum.unassigned)}</strong> of phone charges aren't assigned to anyone yet. Fix it in Entries or Settings.` : ""}</p>
    ${!state.isOwner && me ? whoPicker(false) : ""}
    ${!bills.length && state.isOwner ? `<p><button class="btn primary" data-go="add">Add a bill</button></p>` : ""}</section>`;

  if (!state.isOwner && me){

    html += `<h2>Your part of each bill</h2><div class="panel">${mineBills.length ? `<div class="list">` + mineBills.map(e => itemHtml(e, me)).join("") + `</div>
      <div class="check" style="margin-top:12px"><strong>Your total this month: ${money(sum.owes[me])}</strong>${sum.paid[me]?` · you paid ${money(sum.paid[me])} of the bills yourself`:""}${sum.settled[me]?` · you've sent ${money(sum.settled[me])}`:""}</div>` : `<div class="empty">Nothing assigned to you this month.</div>`}</div>`;
  }

    html += `<h2>What you collect for ${MONTHS[state.month-1]}</h2><div class="panel">${c.rows.length ? `<div class="scroll"><table style="min-width:0"><thead><tr><th>From</th><th>Total due</th><th>Received</th><th>Still to collect</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td>${esc(r.p)}</td><td>${money(r.expected)}</td><td>${r.got?`<span class="pos">${money(r.got)}</span>`:'<span class="muted">—</span>'}</td><td class="${r.left>0.005?'neg':''}">${r.left>0.005?money(r.left):"✓ paid"}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td>Total</td><td>${money(c.expected)}</td><td>${money(c.got)}</td><td>${money(c.left)}</td></tr></tfoot></table></div>` : `<p class="muted" style="margin:0">Nobody owes you for this month.</p>`}</div>`;
  }
  html += `<h2>Who owes what this month</h2><div class="panel scroll"><table><thead><tr><th>Person</th><th>House bills</th><th>Phones</th><th>Their part</th><th>Paid</th><th>Still owed</th><th>In account</th></tr></thead><tbody>`;
  s.people.filter(p => p!==me).forEach(p => { const b = sum.balance[p]; const acct = state.isOwner ? accountOf(p).account : 0;
    html += `<tr><td>${esc(p)}</td><td>${money(sum.house[p])}</td><td>${money(sum.phone[p])}</td><td>${money(sum.owes[p])}</td><td>${(sum.marked[p]+sum.own[p])>0.004?`<span class="pos">${money(sum.marked[p]+sum.own[p])}</span>`:'<span class="muted">—</span>'}</td><td class="${b< -0.005?'neg':''}">${b< -0.005?money(-b):'<span class="pos">✓</span>'}</td><td>${acct>0.005?money(acct):'<span class="muted">—</span>'}</td></tr>`; });
  html += `</tbody></table><p class="muted" style="margin:10px 0 0;font-size:13px">“In account” is money they've paid in, or bills they covered for the house, not yet used. Tap Mark paid to use it.</p></div>`;
  if (state.isOwner) html += statementsPanel(sum);
  const cats = catList(list); const maxCat = Math.max(1, sum.personal, ...cats.map(c=>sum.cat[c]||0));
  html += `<h2>Where the money went</h2><div class="panel">${donutHtml([...cats.map(c => [c, sum.cat[c]||0]), ...(state.isOwner ? [["Not split", sum.personal]] : [])])}</div>`;
  app.innerHTML = html; wireGo();
  app.querySelectorAll("[data-pay]").forEach(b => b.onclick = async () => {
    const m = moves[+b.dataset.pay]; if (!m) return;
    if (m.to === me){ b.disabled = true; try { await payFromAccount(m.from, `${state.year}-${pad(state.month)}`); } catch(x){ toast("Couldn't update the bills"); } b.disabled = false; return; }

    b.disabled = true;

  app.querySelectorAll("[data-stmt]").forEach(b => b.onclick = async () => { const t = b.textContent; b.disabled = true; b.textContent = "Building…"; try { await previewStatement(b.dataset.stmt, b, !!$("#stmtPhotos")?.checked, b.dataset.mode||"all"); } catch(x){ toast("Couldn't make the PDF"); } b.disabled = false; b.textContent = t; });
  const pl = app.querySelector(".paylog"); if (pl) pl.addEventListener("toggle", () => { state.payOpen = pl.open; });
  app.querySelectorAll("[data-unpay]").forEach(b => b.onclick = () => confirmFirst(b, async () => { const x = state.expenses.find(e=>e.id===b.dataset.unpay); try { await track(`Removed payment ${x?`${x.from} → ${x.to} ${money(x.amount)}`:""}`, () => wDel("expenses/"+b.dataset.unpay)); toast("Payment removed"); } catch(e){ toast("Couldn't remove it"); } }));
}

// Two-step confirm: first tap turns the button into "Yes, undo", second tap does it. Resets after 5 seconds.
function confirmFirst(b, action){
  if (b.dataset.armed === "1"){ clearTimeout(b._t); b.dataset.armed = ""; action(); return; }
  b.dataset.armed = "1"; b._label = b.textContent; b.textContent = "Yes, undo"; b.classList.add("armed");
  b._t = setTimeout(() => { b.dataset.armed = ""; b.textContent = b._label; b.classList.remove("armed"); }, 5000);
}
function owersHtml(e){

async function shrinkImage(file){
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
    const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.86));
  } catch(e){ return file; }
}
async function pdfToImages(file, maxPages){
  if (!window.pdfjsLib) throw new Error("pdf.js missing");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const out = [];
  for (let i=1; i<=Math.min(pdf.numPages, maxPages); i++){
    const page = await pdf.getPage(i); const vp1 = page.getViewport({scale:1});
    const vp = page.getViewport({scale: 1400 / vp1.width});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    out.push(await new Promise(res => c.toBlob(res, "image/jpeg", 0.86)));
  }
  return out;
}
async function pdfText(file, maxPages){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let out = "";
  for (let i=1; i<=Math.min(pdf.numPages, maxPages); i++){
    const tc = await (await pdf.getPage(i)).getTextContent();
    let lastY = null, line = [];
    const lines = [];
    tc.items.forEach(it => { const yy = Math.round(it.transform[5]); if (lastY !== null && Math.abs(yy-lastY) > 2){ lines.push(line.join(" ")); line = []; } line.push(it.str); lastY = yy; });
    if (line.length) lines.push(line.join(" "));
    out += `\n--- Page ${i} ---\n` + lines.map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean).join("\n");
    if (out.length > 55000) break;
  }
  return out.slice(0, 55000);
}
const ACTIVITY = /(talk\s*activity|call\s*activity|text\s*activity|messaging\s*activity|data\s*activity|usage\s*details|activity\s*details)/i;
// Read a PDF's pages until the usage/activity section starts; return those page numbers, their text,
// and a trimmed copy of the PDF without the activity pages.
async function analyzePdf(file, maxPages){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;
  const keep = []; let text = "";
  for (let i=1; i<=pdf.numPages && keep.length < maxPages; i++){
    const tc = await (await pdf.getPage(i)).getTextContent();
    const lines = []; let lastY = null, line = [];
    tc.items.forEach(it => { const yy = Math.round(it.transform[5]); if (lastY !== null && Math.abs(yy-lastY) > 2){ lines.push(line.join(" ")); line = []; } line.push(it.str); lastY = yy; });
    if (line.length) lines.push(line.join(" "));
    const pageText = lines.map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean).join("\n");
    if (i > 1 && ACTIVITY.test(pageText)) break;               // stop at talk/text/data activity
    keep.push(i); text += `\n--- Page ${i} ---\n` + pageText;
  }
  let trimmed = file;
  if (keep.length < pdf.numPages && window.PDFLib){
    try {
      const src = await PDFLib.PDFDocument.load(buf.slice(0), {ignoreEncryption:true});
      const out = await PDFLib.PDFDocument.create();
      (await out.copyPages(src, keep.map(n=>n-1))).forEach(pg => out.addPage(pg));
      trimmed = new File([await out.save()], file.name.replace(/\.pdf$/i,"") + " (charges).pdf", {type:"application/pdf"});
    } catch(x){ trimmed = file; }
  }
  const images = [];
  for (const i of keep){
    const page = await pdf.getPage(i); const vp1 = page.getViewport({scale:1});
    const vp = page.getViewport({scale: 1400 / vp1.width});
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    images.push(await new Promise(res => c.toBlob(res, "image/jpeg", 0.86)));
  }
  return {images, text: text.slice(0, 60000), trimmed, kept: keep.length, total: pdf.numPages};
}
async function filesToPages(list, maxPages){
  const pages = [], pdfs = [], texts = []; const info = [];
  for (const f of list){
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)){
      const a = await analyzePdf(f, maxPages); pages.push(...a.images); pdfs.push(a.trimmed); texts.push(a.text); info.push(a);
    } else pages.push(await shrinkImage(f));
  }
  return {pages, pdfs, texts, info};
}

const OCR_DATA = "be984464a1a376759e6f01ea8610cb43";   // English OCR model, gzip, base64
function loadScript(src){ return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src === src)) return res(); const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("script")); document.head.appendChild(el); }); }
function idbPut(key, val){ return new Promise((res, rej) => { const rq = indexedDB.open("keyval-store", 1); rq.onupgradeneeded = () => rq.result.createObjectStore("keyval"); rq.onerror = () => rej(rq.error);
  rq.onsuccess = () => { const tx = rq.result.transaction("keyval", "readwrite"); tx.objectStore("keyval").put(val, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }; }); }
function idbHas(key){ return new Promise(res => { try { const rq = indexedDB.open("keyval-store", 1); rq.onupgradeneeded = () => rq.result.createObjectStore("keyval"); rq.onerror = () => res(false);
  rq.onsuccess = () => { try { const g = rq.result.transaction("keyval").objectStore("keyval").get(key); g.onsuccess = () => res(g.result !== undefined); g.onerror = () => res(false); } catch(x){ res(false); } }; } catch(x){ res(false); } }); }

  if (!window.Tesseract) throw new Error("ocr lib");

let logGroup = null;
async function track(label, fn){

  try { return await fn(); }

// Render only the Verizon pages that matter for this person: the page listing every line,

async function phonePagesFor(e, person){
  const mine = (e.lines||[]).filter(l => l.assignedTo===person && /^\d{4}$/.test(String(l.last4))).map(l => String(l.last4));
  if (!mine.length) return [];
  const r = await fetch(await signedUrl(e.pdf)); if (!r.ok) throw new Error("fetch");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({data: await r.arrayBuffer()}).promise;
  const numRe = d => new RegExp("\\d{3}\\D{0,3}" + d + "(?!\\d)");
  const out = [];
  for (let i=1; i<=pdf.numPages && out.length < 14; i++){
    const page = await pdf.getPage(i); const tc = await page.getTextContent();
    const flat = tc.items.map(it=>it.str).join("");
    if (!/verizon|billing\s*period/i.test(flat)) continue;
    if (i > 1 && ACTIVITY.test(flat)) break;                    // talk/text/data activity: stop
    const vp1 = page.getViewport({scale:1}); const vp = page.getViewport({scale: 1400 / vp1.width});
    const W = vp.width, H = vp.height;
    // group text pieces into rows so a number split across pieces is still found
    const pieces = tc.items.filter(it => it.str.trim()).map(it => { const t = pdfjsLib.Util.transform(vp.transform, it.transform); return {str:it.str, x:t[4], y:t[5], fh:Math.hypot(t[2],t[3])}; }).sort((a,b)=>a.y-b.y || a.x-b.x);
    const rows = [];
    pieces.forEach(p => { const row = rows.find(r => Math.abs(r.y - p.y) < Math.max(3, p.fh*0.45)); if (row){ row.parts.push(p); row.fh = Math.max(row.fh, p.fh); } else rows.push({y:p.y, fh:p.fh, parts:[p]}); });
    rows.forEach(r => { r.parts.sort((a,b)=>a.x-b.x); r.text = r.parts.map(p=>p.str).join(""); r.x = r.parts[0].x; });
    rows.sort((a,b)=>a.y-b.y);
    const bands = [];
    rows.forEach((r, k) => {
      if (!mine.some(d => numRe(d).test(r.text))) return;
      // the amount sits on the name row just above the number
      let top = r.y - r.fh*1.1;
      for (let j = k-1; j >= Math.max(0, k-3); j--){ if (/\$\s?\d/.test(rows[j].text) && r.y - rows[j].y < r.fh*6){ top = rows[j].y - rows[j].fh*1.1; break; } }
      bands.push({x1: Math.min(r.x, W*0.06) - 6, y1: top, y2: r.y + r.fh*0.45});
    });
    if (!bands.length) continue;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,H);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = "rgba(255,214,0,0.6)";
    bands.forEach(b => ctx.fillRect(Math.max(0,b.x1), b.y1, W*0.605 - Math.max(0,b.x1), b.y2 - b.y1));
    ctx.globalCompositeOperation = "source-over";
    out.push({url: c.toDataURL("image/jpeg", 0.85), w: W, h: H});
  }
  return out;
}

// ----- Statement: allocate what a person has paid against what they owe (mortgage first, then oldest) -----
// Each person's account: money they've paid in (plus bills they covered for others), minus bill parts paid from it.
function accountOf(person, lastP){
  const me = S().me; let acct = 0, unpaid = 0; const open = [];
  state.expenses.forEach(e => {
    if (e.kind === "payment"){ if (e.from===person && e.to===me) acct += +e.amount||0; else if (e.from===me && e.to===person) acct -= +e.amount||0; return; }
    const sh = sharesOf(e); const mine = sh[person]||0;
    if (e.paidBy === person){
      acct += (+e.amount||0) - mine;                                  // they covered everyone else's part
      if ((e.paidOff||{})[me] && me !== person) acct -= sh[me]||0;    // you paid them back your part
      return;
    }
    if (mine <= 0.004) return;
    if ((e.paidOff||{})[person]) { acct -= mine; return; }
    if (lastP && periodOf(e) > lastP) return;
    unpaid += mine; open.push({e, share:mine, period:periodOf(e), mortgage: e.recurringId==="mortgage" || /mortgage/i.test(e.category||"")});
  });
  open.sort((a,b) => (a.mortgage - b.mortgage) || a.period.localeCompare(b.period) || a.e.date.localeCompare(b.e.date));   // mortgage last
  acct = Math.abs(acct) < 0.015 ? 0 : r2(acct);
  return {account: acct, unpaid: r2(unpaid), open};
}
async function payFromAccount(person, lastP){
  const a = accountOf(person, lastP); let left = a.account, used = 0, n = 0;
  if (left < 0.01){ toast(`${person} has nothing in their account yet. Add their payment first.`); openPay(person, a.unpaid); return; }
  await track(`Paid bills from ${person}'s account`, async () => {
  for (const it of a.open.filter(o => o.period <= lastP)){
    if (it.share > left + 0.005) continue;
    const e = state.expenses.find(x=>x.id===it.e.id); if (!e) continue;

    await wSet("expenses/"+id, {...JSON.parse(JSON.stringify(body)), paidOff:{...(e.paidOff||{}), [person]: isoToday}, updatedAt:new Date().toISOString()});
    left = r2(left - it.share); used = r2(used + it.share); n++;
  }

  });
  if (!n){ toast(`${person}'s account has ${money(a.account)}, not enough for the next bill. Add a payment first.`); openPay(person, r2(a.open[0] ? a.open[0].share - a.account : 0)); return; }
  toast(`Paid ${n} bill${n>1?"s":""} (${money(used)}) from ${person}'s account. ${money(left)} left in it.`);
}
function statementLedger(person, lastP){
  const exp = state.expenses.filter(e => periodOf(e) && periodOf(e) <= lastP);
  const billName = e => `${e.kind==="phone"?"Phone":e.category==="Other Shared"?"Other":e.category}${e.vendor && e.vendor!==e.category?" - "+e.vendor:""}`;
  const isMortgage = e => e.recurringId==="mortgage" || /mortgage/i.test(e.category||"");
  const items = [], credits = [];
  exp.forEach(e => {
    if (e.kind === "payment"){
      if (e.from===person) credits.push({date:e.date, desc:"Payment", amount:+e.amount||0});
      else if (e.to===person) credits.push({date:e.date, desc:"Payment received", amount:-(+e.amount||0)});
      return;
    }
    const sh = sharesOf(e); const mine = sh[person]||0;
    if (e.paidBy === person){
      const front = (+e.amount||0) - mine;
      if (front > 0.004) credits.push({date:e.date, desc:`You paid ${billName(e)} (others' part)`, amount:front});
      Object.entries(e.paidOff||{}).forEach(([who, when]) => { const v = sh[who]||0; if (who===S().me && who!==person && v>0.004) credits.push({date:when, desc:`Paid back to you: ${billName(e)}`, amount:-v}); });
      return;
    }
    if (mine <= 0.004) return;
    const marked = (e.paidOff||{})[person];
    items.push({e, name:billName(e), period:periodOf(e), date:e.date, share:mine, mortgage:isMortgage(e), marked, paid: marked ? mine : 0, left: marked ? 0 : mine});
  });
  let pool = credits.reduce((a,c)=>a+c.amount,0);
  // bills already paid from their account use that money first
  items.filter(i=>i.marked).forEach(i => { pool -= i.share; });
  pool = Math.abs(pool) < 0.015 ? 0 : r2(pool);   // ignore half-cent rounding
  // money in their account pays whole bills only, oldest first, mortgage last; nothing is taken off a bill partly
  const order = items.filter(i=>!i.marked).sort((a,b) => (a.mortgage - b.mortgage) || a.period.localeCompare(b.period) || a.date.localeCompare(b.date));
  order.forEach(i => { if (pool > 0 && i.left <= pool + 0.005){ i.paid = i.left; pool = r2(pool - i.left); i.left = 0; } });
  items.sort((a,b) => a.period.localeCompare(b.period) || (b.mortgage - a.mortgage) || a.date.localeCompare(b.date));
  credits.sort((a,b) => String(a.date).localeCompare(String(b.date)));
  const totalShare = r2(items.reduce((a,i)=>a+i.share,0));
  const openBills = r2(items.reduce((a,i)=>a+i.left,0) + (pool < 0 ? -pool : 0));
  const inAccount = pool > 0 ? r2(pool) : 0;
  const totalLeft = r2(Math.max(0, openBills - inAccount));
  const markedPaid = 0;
  return {items, credits, totalShare, totalLeft, openBills, inAccount, credit: inAccount > openBills + 0.005 ? r2(inAccount - openBills) : 0, markedPaid, creditsTotal: r2(credits.reduce((a,c)=>a+c.amount,0))};
}

async function previewStatement(person, btn, withPhotos, mode="all"){

function openPay(presetFrom, presetAmt){
  const s = S(); const me = ME(); const {rows, cum:cum0} = periodBalances();

  const others = s.people.filter(p=>p!==me);

  const nowP = `${today.getFullYear()}-${pad(today.getMonth()+1)}`;
  const periods = [...new Set([...rows.map(r=>r.period), nowP])].sort();
  $("#payBody").innerHTML = `<div class="grid">

    <label class="f">To<select id="dTo">${s.people.map(p=>`<option ${p===me?"selected":""}>${esc(p)}</option>`).join("")}</select></label>

  const from = $("#dFrom"), to = $("#dTo"), amt = $("#dAmt");
  const hint = () => { const p = from.value; const owe = -(cum[p]||0);
    $("#dHint").textContent = to.value===me ? (owe > 0.005 ? `${p} still owes ${money(owe)} in total. This payment goes into ${p}'s account.` : `${p} doesn't owe anything right now. This payment goes into ${p}'s account.`) : `This is money you're paying ${to.value}.`;
    amt.placeholder = owe > 0.005 ? String(r2(owe)) : ""; };
  from.onchange = hint; to.onchange = hint; hint();

  $("#payDlg").onclick = e => { if (e.target.id === "payDlg") close(); };

async function runRecurring(){
  if (state.recurRunning || !state.isOwner || !state.db || !state.gotExp || !state.gotSettings) return;
  state.recurRunning = true; try {
  const s = S(); const now = `${today.getFullYear()}-${pad(today.getMonth()+1)}`; let added = 0;
  for (const r of (s.recurring||[])){
    if (r.active === false || !/^\d{4}-\d{2}$/.test(r.start||"") || !(+r.amount)) continue;
    let p = r.start, guard = 0;
    while (p <= now && guard++ < 60){
      const [y,m] = p.split("-").map(Number); const day = Math.min(+r.day||25, new Date(y,m,0).getDate());
      const due = p < now || today.getDate() >= day;
      const id = `rec-${r.id}-${p}`;
      if (due && !(r.skip||[]).includes(p) && !state.expenses.some(e=>e.id===id)){
        const sd = parseInt(r.serviceDay); let svc = {};
        if (sd >= 1 && sd <= 28){ const [py,pm] = p.split("-").map(Number); const prev = pm===1 ? `${py-1}-12` : `${py}-${pad(pm-1)}`; svc = {serviceFrom:`${prev}-${pad(sd)}`, serviceTo:`${p}-${pad(sd)}`}; }
        try { await state.db.collection("expenses").doc(id).set({...svc, kind:"shared", recurringId:r.id, category:r.name, vendor:r.name, amount:r2(r.amount), paidBy:r.paidBy, fixedShares:{...r.shares}, date:`${p}-${pad(day)}`, period:p, notes:"", photos:[], pdf:null, updatedAt:new Date().toISOString()}); added++; } catch(x){}
      }
      p = nextPeriod(p);
    }
  }
  if (added) toast(`${added} monthly bill${added>1?"s":""} added`);
  } finally { state.recurRunning = false; }
}

async function ensureSigned(ids){
  const need = [...new Set(ids)].filter(i => i && !signed[i]);
  if (!need.length || !sb) return false;
  const { data } = await sb.storage.from("bills").createSignedUrls(need.map(i => `${uid}/${i}`), 60*60*24*7);
  (data||[]).forEach((d, k) => { if (d && d.signedUrl) signed[need[k]] = d.signedUrl; });
  return true;
}
async function signedUrl(id){ await ensureSigned([id]); return signed[id] || ""; }
function assetIds(){ const s = new Set(); [...state.expenses, ...state.personal].forEach(e => { (e.photos||[]).forEach(i => s.add(i)); if (e.pdf) s.add(e.pdf); }); return [...s]; }

// a small document store on top of the "docs" table, with live updates
function makeDb(){
  const cache = new Map(); const subs = new Set();
  const notify = () => subs.forEach(f => { try { f(); } catch(x){} });
  const inColl = (coll, path) => path.startsWith(coll + "/") && !path.slice(coll.length+1).includes("/");
  const snapDoc = (path) => ({ id: path.split("/").pop(), exists: cache.has(path), data: () => clone(cache.get(path)) });
  const put = async (path, data) => { cache.set(path, clone(data)); notify();
    const { error } = await sb.from("docs").upsert({ owner: uid, path, data, updated_at: new Date().toISOString() }); if (error) throw error; };
  const del = async (path) => { cache.delete(path); notify();
    const { error } = await sb.from("docs").delete().eq("owner", uid).eq("path", path); if (error) throw error; };
  const docRef = (path) => ({ id: path.split("/").pop(), path,
    get: async () => snapDoc(path),
    set: (d) => put(path, d),
    update: (d) => put(path, { ...(cache.get(path)||{}), ...d }),
    delete: () => del(path),
    onSnapshot: (next) => { const f = () => next(snapDoc(path)); subs.add(f); setTimeout(f); return () => subs.delete(f); } });
  const query = (coll, order, lim) => ({
    orderBy: (field, dir="asc") => query(coll, {field, dir}, lim),
    limit: (n) => query(coll, order, n),
    where: () => query(coll, order, lim),
    onSnapshot: (next) => { const f = () => {
        let docs = [...cache.keys()].filter(k => inColl(coll, k)).map(snapDoc);
        if (order) docs.sort((a,b) => { const x = a.data()[order.field], y = b.data()[order.field]; return (x > y ? 1 : x < y ? -1 : 0) * (order.dir==="desc" ? -1 : 1); });
        if (lim) docs = docs.slice(0, lim);
        next({ docs, size: docs.length, empty: !docs.length }); };
      subs.add(f); setTimeout(f); return () => subs.delete(f); } });
  const collRef = (coll) => ({ ...query(coll), path: coll,
    doc: (id) => docRef(coll + "/" + (id || rid())),
    add: async (d) => { const r = docRef(coll + "/" + rid()); await r.set(d); return r; } });
  return {
    doc: docRef, collection: collRef,
    async load(){ let from = 0; for(;;){ const { data, error } = await sb.from("docs").select("path,data").eq("owner", uid).range(from, from+999); if (error) throw error; (data||[]).forEach(r => cache.set(r.path, r.data)); if (!data || data.length < 1000) break; from += 1000; } notify(); },
    live(){ sb.channel("docs-" + uid).on("postgres_changes", { event: "*", schema: "public", table: "docs", filter: `owner=eq.${uid}` }, (p) => {
        if (p.eventType === "DELETE"){ const path = p.old && p.old.path; if (path && cache.has(path)){ cache.delete(path); notify(); } }
        else if (p.new && p.new.path){ cache.set(p.new.path, p.new.data); notify(); } }).subscribe(); },
    async bulk(rows){ for (let i=0; i<rows.length; i+=200){ const { error } = await sb.from("docs").upsert(rows.slice(i, i+200).map(r => ({ owner: uid, path: r.path, data: r.data, updated_at: new Date().toISOString() }))); if (error) throw error; } rows.forEach(r => cache.set(r.path, r.data)); notify(); }
  };
}
function makeAssets(){
  return {
    async upload(blob, opts={}){ const id = hexId(); const { error } = await sb.storage.from("bills").upload(`${uid}/${id}`, blob, { contentType: opts.contentType || blob.type || "application/octet-stream", upsert: false }); if (error) throw error; await ensureSigned([id]); return { id, url: signed[id] }; },
    async uploadAs(id, blob, contentType){ const { error } = await sb.storage.from("bills").upload(`${uid}/${id}`, blob, { contentType, upsert: true }); if (error) throw error; },
    async delete(id){ await sb.storage.from("bills").remove([`${uid}/${id}`]); delete signed[id]; }
  };
}
const toB64 = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
function parseJsonLoose(text){ const t = String(text||"").replace(/```json|```/g, "").trim(); try { return JSON.parse(t); } catch(x){} const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b+1)); } catch(x){} } const e = new Error("invalid_json"); e.code = "invalid_json"; throw e; }
// Bill reading runs straight from the website: your Anthropic API key is kept on this device only (never in the code or the database).
const KEY_STORE = "gd-anthropic-key";
const getApiKey = () => { try { return localStorage.getItem(KEY_STORE) || ""; } catch(x){ return ""; } };
function makeSample(){
  return {
    limits: async () => ({ images: { maxCount: 6 } }),
    async json(prompt, opts={}){
      const key = getApiKey();
      if (!key){ const e = new Error("no key"); e.code = "no_key"; throw e; }
      const images = opts.images ? await Promise.all(opts.images.slice(0, 6).map(toB64)) : [];
      const content = [...images.map(data => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data } })), { type: "text", text: prompt + "\n\nReply with ONLY the JSON object." }];
      let r;
      try {
        r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", signal: opts.signal,
          headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true", "content-type": "application/json" },
          body: JSON.stringify({ model: SB.model || "claude-sonnet-5", max_tokens: 4000, messages: [{ role: "user", content }] }) });
      } catch(x){ const e = new Error(x.name === "AbortError" ? "cancelled" : "network"); e.code = x.name === "AbortError" ? "cancelled" : "network"; throw e; }
      const j = await r.json().catch(() => ({}));
      if (!r.ok){ const e = new Error(j?.error?.message || `API error ${r.status}`); e.code = r.status === 401 ? "bad_key" : r.status === 429 ? "rate_limited" : "read_failed"; e.detail = j?.error?.message; throw e; }
      return parseJsonLoose((j.content||[]).filter(c => c.type === "text").map(c => c.text).join(""));
    }
  };
}
const downloadsImpl = {
  async save({ filename, data }){
    const blob = data instanceof Blob ? data : new Blob([data], { type: "text/plain" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
};

// import the file exported from the Claude version
async function importAll(file, btn){
  const j = JSON.parse(await file.text());
  if (j.format !== "41-green-drive-export") throw new Error("That isn't a 41 Green Drive export file.");
  const ids = Object.keys(j.assets || {}); let n = 0;
  for (const id of ids){ n++; if (btn) btn.textContent = `Uploading photos ${n}/${ids.length}…`;
    const url = j.assets[id]; const blob = await (await fetch(url)).blob(); await state.assets.uploadAs(id, blob, blob.type || "application/octet-stream"); }
  if (btn) btn.textContent = "Saving entries…";
  const rows = [];
  if (j.settings) rows.push({ path: "settings/main", data: j.settings });
  (j.expenses||[]).forEach(e => { const { id, ...d } = e; rows.push({ path: "expenses/" + id, data: d }); });
  (j.personal||[]).forEach(e => { const { id, ...d } = e; rows.push({ path: PRIVATE + "/" + id, data: d }); });
  (j.log||[]).forEach(e => { const { id, ...d } = e; rows.push({ path: LOG + "/" + id, data: d }); });
  await state.db.bulk(rows);
  await ensureSigned(assetIds());
  return { entries: (j.expenses||[]).length + (j.personal||[]).length, photos: ids.length };
}

// ---------- sign in ----------
function renderSignIn(msg){
  document.querySelectorAll("header [data-view],[data-owner]").forEach(b => b.hidden = true);
  $("#period").style.visibility = "hidden";
  app.innerHTML = `<section class="hero"><p class="statement" style="color:var(--ink)">Sign in</p><p class="sub">41 Green Drive Expenses</p></section>
    <div class="panel" style="max-width:420px"><div class="grid" style="grid-template-columns:1fr">
      <label class="f">Email<input id="siEmail" type="email" autocomplete="username" inputmode="email"></label>
      <label class="f">Password<input id="siPass" type="password" autocomplete="current-password"></label></div>
      <div class="row" style="margin-top:14px"><button class="btn primary" id="siGo">Sign in</button><span class="status" id="siMsg" style="margin:0">${esc(msg||"")}</span></div></div>`;
  const go = async () => { $("#siMsg").textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email: $("#siEmail").value.trim(), password: $("#siPass").value });
    if (error){ $("#siMsg").textContent = "That email or password didn't work."; return; } location.reload(); };
  $("#siGo").onclick = go; $("#siPass").onkeydown = e => { if (e.key === "Enter") go(); };
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }

// ---------- boot ----------
(async () => {
  if (!window.supabase || !SB.supabaseUrl || /PASTE_/.test(SB.supabaseUrl + SB.supabaseAnonKey)){
    app.innerHTML = `<div class="banner">Setup isn't finished: open <b>config.js</b> and paste your Supabase Project URL and anon key.</div>`; return;
  }
  sb = window.supabase.createClient(SB.supabaseUrl, SB.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ renderSignIn(); return; }
  uid = session.user.id;
  const db = makeDb();
  state.db = db; state.downloads = downloadsImpl; state.assets = makeAssets(); state.isOwner = true; state.sample = makeSample();
  try { await db.load(); } catch(e){ app.innerHTML = `<div class="banner">Couldn't load your data: ${esc(e.message||e)}. Check that setup.sql was run, then reload.</div>`; return; }
  db.live();
  db.doc("settings/main").onSnapshot(snap => { state.settings = snap.exists ? snap.data() : null; state.gotSettings = true; runRecurring(); if (!busy()) render(); });
  db.collection("expenses").onSnapshot(async snap => {
    state.expenses = snap.docs.map(d => ({id:d.id, ...d.data()}));
    state.gotExp = true; runRecurring();
    if (await ensureSigned(assetIds()).catch(()=>false)) {}
    if (!busy()) render();
  });
  db.collection(LOG).orderBy("at","desc").limit(300).onSnapshot(snap => { state.log = snap.docs.map(d => ({id:d.id, ...d.data()})); if (state.view==="history") render(); });
  db.collection(PRIVATE).onSnapshot(snap => { state.personal = snap.docs.map(d => ({id:d.id, ...d.data()})); if (!busy()) render(); });
})();
})();
